# Builds Capsule and runs every test on Windows, as build.cmd does on a PC: for each pull request, each push to main,
# and on demand. Nothing is published.
name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Use a time zone other than UTC
        # GitHub's machines run on UTC, where a local date and a UTC date are always the same day, so the checks that
        # Capsule uses the local one (Codex's day folders) couldn't run. UTC+8, without daylight saving.
        shell: pwsh
        run: Set-TimeZone -Id "Singapore Standard Time"
      - name: Build and run the tests
        shell: cmd
        run: build.cmd
